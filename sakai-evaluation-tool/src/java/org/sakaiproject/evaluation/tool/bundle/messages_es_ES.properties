modifynoderules.instructions.1=Introduzca valores para coincidir con los t\u00EDtulos del sitio o de la secci\u00F3n con el fin de seleccionar sitios o secciones para este nodo jerarqu\u00EDa. Las opciones disponibles indican al sistema que coincida con los t\u00EDtulos de sitio o secci\u00F3n, y si debe coincidir con el texto al principio, al finalizar, en cualquier parte del t\u00EDtulo, o exactamente con el t\u00EDtulo completo.
modifynoderules.instructions.2=Por ejemplo, dado el criterio de texto "BSKTWEAV", con la opci\u00F3n "Comienza con" y la opci\u00F3n "T\u00EDtulo del sitio", el sistema encontrar\u00E1 cualquier sitio que contenga los caracteres 'BSKTWEAV' al inicio del t\u00EDtulo. En cambio, la misma regla con la opci\u00F3n 'Finaliza con' encontrar\u00EDa cualquier sitio que tuviera los caracteres 'BSKTWEAV' al final de su t\u00EDtulo.
