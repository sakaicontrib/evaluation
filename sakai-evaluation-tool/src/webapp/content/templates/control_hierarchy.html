<!DOCTYPE html      PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
     "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:rsf="http://ponder.org.uk/rsf" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title rsf:id="msg=controlhierarchy.page.title">Control Hierarchy</title>
    <!-- standard on all pages -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/library/skin/tool_base.css" rsf:id="scr=portal-matter" type="text/css" rel="stylesheet" media="all"/>
    <link href="/library/skin/default/tool.css" rsf:id="scr=portal-matter" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/headscripts.js" rsf:id="scr=portal-matter" type="text/javascript" language="JavaScript"></script>
    <!-- end standard on all pages -->
    <script type="text/javascript" src="/library/js/spinner.js"></script>
    <link href="../css/evaluation_base.css" type="text/css" rel="stylesheet" media="all" />
    <link rsf:id="local_css_include" href="local_css_file.css" type="text/css" rel="stylesheet" media="all" />
</head>
<body>
<div class="portletBody">

     <div rsf:id="navIntraTool:" class="navIntraTool"/>

    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <nav aria-label="breadcrumb" class="flex-grow-1">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a rsf:id="summary-link" href="summary.html">Summary</a></li>
          <li class="breadcrumb-item"><a rsf:id="administrate-link" href="administrate.html">Administrate</a></li>
          <li class="breadcrumb-item active" aria-current="page">Hierarchy</li>
        </ol>
      </nav>
    </div>

    <h3 rsf:id="msg=controlhierarchy.table.hierarchy.header">Control Hierarchy</h3> 
    <a rsf:id="show-hide-groups" href="">Show/Hide Groups</a> <a rsf:id="show-hide-users" href="">Show/Hide Users</a>
    <div rsf:id="hierarchy-tree:">
        <!-- Everything in here is replaced by the html in /evaluation/tool/src/webapp/component-templates/hierarchy_controls.html -->
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th rsf:id="hierarchy-header">Hierarchy Level</th>
                    <th rsf:id="items-level-header">Items at this level:</th>
                    <th rsf:id="assign-groups-header">Assign Groups</th>
                </tr>
            </thead>
            <tbody>
                <tr rsf:id="hierarchy-level-row:">
                    <td rsf:id="node-name" class="noTextIndent"> - Institution Level</td>
                    <td>
                        <span rsf:id="number-children">3</span>
                        <a rsf:id="add-child-link" class="inlineLink" href="">Add</a>
                        <a rsf:id="modify-node-link" class="inlineLink" href="">Modify</a>
                        <form rsf:id="remove-node-form">
                            <input type="submit" rsf:id="remove-node-button" value="Remove" onclick="SPNR.disableControlsAndSpin( this, null );" />
                        </form>
                    </td>
                    <td>
                        <a rsf:id="assign-groups-link" href="">Assign Groups</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <a href="" rsf:id="done-link">Done</a>
</div>
</body>
</html>
