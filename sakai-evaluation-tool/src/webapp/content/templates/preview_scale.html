<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:rsf="http://ponder.org.uk/rsf" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <!-- standard on all pages -->
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/library/skin/tool_base.css" rsf:id="scr=portal-matter" type="text/css" rel="stylesheet" media="all"/>
  <link href="/library/skin/default/tool.css" rsf:id="scr=portal-matter" type="text/css" rel="stylesheet" media="all"/>
  <script src="/library/js/headscripts.js" rsf:id="scr=portal-matter" type="text/javascript" language="JavaScript"></script>
  <!-- end standard on all pages -->
  <link href="/sakai-evaluation-tool/content/css/evaluation_base.css" type="text/css" rel="stylesheet" media="all" />
  <link rsf:id="local_css_include" href="local_css_file.css" type="text/css" rel="stylesheet" media="all" />
  <script src="/sakai-evaluation-tool/content/js/eval.portal.shim.js" type="text/javascript"></script>
</head>
<body>
<div class="evaluation preview-item">
  <div class="preview-actions" style="margin-bottom:1rem;">
    <button type="button" class="btn btn-outline-secondary" onclick="if (window.history.length > 1) { window.history.back(); return false; } if (document.referrer) { window.location.href=document.referrer; return false; } window.close(); return false;">Back</button>
  </div>
  <div id="items_container">
    <h3 rsf:id="previewed:header"><a rsf:id="previewed-title" href="#">Scale Preview</a></h3>
    <div rsf:id="previewed:item" style="min-width: 200px; max-width: 800px">
      <!-- DIV tag for item renderer - everything in here is replaced -->
      <table>
        <tr>
          <td width="3%" valign="top" style="font-weight: bold;">
            <span>0</span>.&nbsp;
          </td>
          <td width="87%" valign="top">
            <span></span>
          </td>
          <td width="10%" nowrap="nowrap" valign="top" align="right">
            <div>
              <input type="checkbox" rsf:id="itemNA" />
              <label>N/A</label>
            </div>
          </td>
        </tr>
        <tr>
          <td>&nbsp;</td>
          <td colspan="2">
            <textarea cols="80"></textarea>
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
