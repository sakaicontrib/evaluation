<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifyscale.page.title}">Add/Edit Scale</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <!-- Navigation -->
    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <!-- Breadcrumb -->
    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_scales}" th:text="#{controlscales.page.title}">Control Scales</a></li>
        <li class="lastCrumbNoFloat" th:text="#{modifyscale.page.title}">Add/Edit Scale</li>
    </ul>

    <!-- Flash error messages -->
    <div th:if="${errorMessage}" class="alertMessage">
        <ul><li th:text="${errorMessage}">Error</li></ul>
    </div>

    <form id="modify-scale-form" th:action="@{/modify_scale}" method="post" class="scale_modify_form">
        <input type="hidden" name="scaleId" th:if="${scaleId != null}" th:value="${scaleId}"/>

        <p class="shorttext">
            <label for="scale-title-id" th:text="#{modifyscale.scale.title.note}">Title</label>
            <input type="text" id="scale-title-id" name="title" th:value="${title}" maxlength="100" size="30"/>
            &nbsp;
            <a th:if="${canRemove}"
               th:href="@{/remove_scale(scaleId=${scaleId})}"
               th:text="#{modifyscale.remove.scale.link}">Remove Scale</a>
        </p>

        <h4 th:text="#{modifyscale.adddropscale.note.start}">Scale Options</h4>
        <div class="labelindnt scale_points_container">
            <div id="scale-options-list">
                <div th:each="opt,stat : ${options}" th:id="${'opt-row-' + stat.index}" class="scale-option-row" style="margin-bottom:4px">
                    <input type="text" name="options" th:value="${opt}" maxlength="250"
                           th:id="${'opt-' + stat.index}"/>
                    &nbsp;
                    <button type="button" class="removeScaleOption"
                            th:text="#{modifyscale.remove.scale.option.button}"
                            onclick="removeScaleOption(this)">Remove</button>
                    <br/>
                </div>
            </div>
            <div style="margin-top:4px">
                <button type="button" id="add-scale-option" class="addItem"
                        th:text="#{modifyscale.add.scale.option.button}"
                        onclick="addScaleOption()">Add Scale Point</button>
            </div>
        </div>

        <h4 th:text="#{modifyscale.scale.ideal.note.start}">Ideal</h4>
        <p class="instructionText" th:text="#{modifyscale.scale.ideal.note.main.text}">
            Indicate the position of the "best" answer in this scale.
        </p>

        <div class="checkbox indnt1">
            <div th:each="i : ${#numbers.sequence(0, idealValues.length - 1)}"
                 class="scale_ideal_container">
                <input type="radio" name="ideal"
                       th:id="${'ideal-' + i}"
                       th:value="${idealValues[i]}"
                       th:checked="${ideal == idealValues[i]}"/>
                <label th:for="${'ideal-' + i}"
                       th:text="#{__${idealLabels[i]}__}">Ideal label</label>
            </div>
        </div>

        <div th:if="${userAdmin}" class="longtext indnt1" style="margin-top:1em">
            <label for="scale-sharing-id" th:text="#{modifyitem.item.sharing.header}">Sharing</label>
            <select id="scale-sharing-id" name="sharing">
                <option th:each="i : ${#numbers.sequence(0, sharingValues.length - 1)}"
                        th:value="${sharingValues[i]}"
                        th:text="#{__${sharingLabels[i]}__}"
                        th:selected="${sharing == sharingValues[i]}">option</option>
            </select>
        </div>

        <p class="act">
            <input type="submit" th:value="#{modifyscale.save.scale.button}" class="active"
                   accesskey="s" onclick="SPNR.disableControlsAndSpin(this, null);"/>
            <input type="button" th:value="#{general.cancel.button}"
                   accesskey="x" onclick="history.go(-1); return false;"/>
        </p>

    </form>

</div>

<script th:inline="javascript">
    var minOptions = [[${minLength}]];
    var maxOptions = [[${maxLength}]];

    function countOptions() {
        return document.querySelectorAll('#scale-options-list .scale-option-row').length;
    }

    function updateRemoveButtons() {
        var rows = document.querySelectorAll('#scale-options-list .scale-option-row');
        var canRemove = rows.length > minOptions;
        rows.forEach(function(row) {
            var btn = row.querySelector('.removeScaleOption');
            if (btn) btn.disabled = !canRemove;
        });
        document.getElementById('add-scale-option').disabled = rows.length >= maxOptions;
    }

    function addScaleOption() {
        if (countOptions() >= maxOptions) return;
        var list = document.getElementById('scale-options-list');
        var idx = list.children.length;
        var div = document.createElement('div');
        div.className = 'scale-option-row';
        div.style.marginBottom = '4px';
        div.innerHTML = '<input type="text" name="options" value="" maxlength="250"/> &nbsp;'
            + '<button type="button" class="removeScaleOption" onclick="removeScaleOption(this)">'
            + document.getElementById('add-scale-option').getAttribute('data-remove-label') + '</button><br/>';
        list.appendChild(div);
        updateRemoveButtons();
    }

    function removeScaleOption(btn) {
        if (countOptions() <= minOptions) return;
        btn.closest('.scale-option-row').remove();
        updateRemoveButtons();
    }

    // Store remove label on add button for reuse
    document.addEventListener('DOMContentLoaded', function() {
        var removeLabel = document.querySelector('.removeScaleOption');
        if (removeLabel) {
            document.getElementById('add-scale-option').setAttribute('data-remove-label', removeLabel.textContent.trim());
        }
        updateRemoveButtons();
    });
</script>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
