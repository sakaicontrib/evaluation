<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{control.import.page.title}">Import XML Data</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{control.import.page.title}">Import XML Data</li>
    </ul>

    <h3 th:text="#{control.import.page.title}">Import XML Data</h3>

    <!-- Error messages -->
    <div th:if="${errorMessage}" class="alertMessage">
        <ul>
            <li th:text="#{__${errorMessage}__}">Error</li>
            <li th:if="${errorDetail}" th:text="${errorDetail}" style="font-size:0.9em;color:#666"></li>
        </ul>
    </div>

    <!-- Import results -->
    <div th:if="${importMessages}" class="alertMessage successMessage">
        <p th:text="#{control.import.success.header}">Import completed:</p>
        <ul>
            <li th:each="msg : ${importMessages}" th:text="${msg}">Message</li>
        </ul>
    </div>

    <p class="instructionText" th:text="#{control.import.instructions}">Select an XML data file to import.</p>

    <form method="post" th:action="@{/control_import/upload}" enctype="multipart/form-data">
        <p>
            <input type="file" name="xmlFile" accept=".xml"/>
        </p>
        <p class="act">
            <input type="submit" class="active" th:value="#{control.import.upload.button}"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
            <input type="button" th:value="#{general.back.button}"
                   onclick="history.go(-1);return false;"/>
        </p>
    </form>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
