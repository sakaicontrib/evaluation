<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{controlexpertitems.page.title}">Expert Item Groups</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li class="lastCrumbNoFloat" th:text="#{controlexpertitems.page.title}">Expert Item Groups</li>
    </ul>

    <h3 th:text="#{controlexpertitems.page.title}">Expert Item Groups</h3>

    <p>
        <a th:href="@{/modify_expert_item(type='ItemGroupCategory',isNew=true)}" th:text="#{controlexpertitems.add.button}" class="button">Add Category</a>
    </p>

    <p th:unless="${hasRows}" th:text="#{controlitems.items.none}">No items</p>

    <table th:if="${hasRows}" class="listHier lines" border="0" cellspacing="0" cellpadding="0" width="100%">
        <thead>
            <tr>
                <th th:text="#{controlexpertitems.page.category}">Category</th>
                <th th:text="#{controlexpertitems.page.objective}">Objective</th>
                <th th:text="#{controlexpertitems.page.description}">Description</th>
                <th th:text="#{controlexpertitems.page.items}">Items</th>
                <th th:text="#{controlexpertitems.page.owner}">Owner</th>
                <th th:text="#{controlexpertitems.page.action}">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${rows}" th:class="${row.odd ? 'itemsListOddLine' : ''}">
                <td th:text="${row.catTitle != null ? row.catTitle : ''}">Category</td>
                <td th:text="${row.objTitle != null ? row.objTitle : ''}">Objective</td>
                <td th:text="${row.description}">Description</td>
                <td th:text="${row.itemCount}">0</td>
                <td th:text="${row.ownerName}">Owner</td>
                <td class="itemAction">
                    <a th:href="${row.editUrl}" th:text="#{general.command.edit}">Edit</a>
                    <a th:if="${row.previewUrl != null}" th:href="${row.previewUrl}"
                       th:text="#{controlexpertitems.display.items}" class="left-separator">Display Items</a>
                    <a th:if="${row.addObjectiveUrl != null}" th:href="${row.addObjectiveUrl}"
                       th:text="#{controlexpertitems.add.objective}" class="left-separator">Add Objective</a>
                    <a th:if="${row.deleteUrl != null}" th:href="${row.deleteUrl}"
                       th:text="#{general.command.delete}" class="left-separator">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
