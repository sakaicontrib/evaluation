<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{takeeval.page.title}">Take Evaluation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
    <meta http-equiv="Expires" content="Mon, 01 Jan 1990 00:00:00 GMT"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <div th:if="${submittedEvalTitle != null and !#strings.isEmpty(submittedEvalTitle)}" style="margin:1em 0 .75em">
        <h3 style="display:inline">
            <span th:text="#{takeeval.eval.title.header}">Evaluation:</span>
            <span th:text="${submittedEvalTitle}">Eval title</span>
        </h3>
    </div>

    <div class="sak-banner-success" role="status">
        <span th:text="#{evaluations.take.message(${submittedEvalTitle})}">Thank you for submitting your evaluation response!</span>
    </div>

</div>
</body>
</html>
