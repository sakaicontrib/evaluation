<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{previewexpertitem.page.title}">Display Items</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_expert_items}" th:text="#{controlexpertitems.page.title}">Expert Items</a></li>
        <li class="lastCrumbNoFloat" th:text="#{previewexpertitem.page.title}">Display Items</li>
    </ul>

    <h3>
        <span th:text="${isCategory ? #{modifyexpertitem.title.cat.label} : #{modifyexpertitem.title.obj.label}}">Category</span>:
        <span th:text="${group.title}">Group Title</span>
    </h3>

    <table class="listHier lines" border="0" cellspacing="0" cellpadding="0" width="100%">
        <thead>
            <tr>
                <th th:text="#{expert.items}">Items</th>
                <th th:text="#{expert.description}">Description</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}" th:class="${item.odd ? 'itemsListOddLine' : ''}">
                <td>
                    <div th:utext="${item.itemText}">Item text</div>
                    <div th:if="${item.scaleOrType != null}" style="font-size:.9em;color:#666" th:text="${item.scaleOrType}">Scale</div>
                </td>
                <td th:utext="${item.expertDescription}">Expert description</td>
            </tr>
        </tbody>
    </table>

    <p class="act">
        <a th:href="@{/control_expert_items}" th:text="#{previewexpertitem.cancel}">Cancel</a>
    </p>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
