<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{chowntemplate.page.title}">Change Template Owner</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_templates}" th:text="#{controltemplates.page.title}">Templates</a></li>
        <li class="lastCrumbNoFloat" th:text="#{chowntemplate.page.title}">Change Template Owner</li>
    </ul>

    <h3 th:text="#{chowntemplate.page.title}">Change Template Owner</h3>

    <!-- No permission -->
    <div th:unless="${canModify}" class="alertMessage">
        <span th:text="#{chowntemplate.nochown.text(${template.title})}">Cannot change owner.</span>
        <a th:href="@{/control_templates}" th:text="#{general.cancel.button}">Cancel</a>
    </div>

    <!-- Form -->
    <div th:if="${canModify}">
        <div th:if="${errorMessage != null}" class="alertMessage">
            <ul><li th:text="#{__${errorMessage}__(${template.title}, '')}">Error</li></ul>
        </div>

        <div class="alertMessage">
            <span th:text="#{chowntemplate.confirm.text(${template.title})}">Are you sure...?</span>
        </div>

        <div class="act">
            <form method="post" th:action="@{/chown_template}" class="inlineForm">
                <input type="hidden" name="templateId" th:value="${templateId}"/>
                <p>
                    <label for="newOwner" th:text="#{chowntemplate.chown.label}">New Owner</label>
                    <input type="text" id="newOwner" name="newOwner" size="50" maxlength="255"/>
                </p>
                <input type="submit" th:value="#{chowntemplate.chown.button}" class="active" accesskey="s"/>
            </form>
            <input type="button" th:value="#{general.cancel.button}"
                   onclick="javascript:history.go(-1);return false;" accesskey="x"/>
        </div>
    </div>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
