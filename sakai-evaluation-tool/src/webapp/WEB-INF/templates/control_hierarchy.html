<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{controlhierarchy.page.title}">Control Hierarchy</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{controlhierarchy.page.title}">Hierarchy</li>
    </ul>

    <h3 th:text="#{controlhierarchy.table.hierarchy.header}">Control Hierarchy</h3>

    <table class="evalsysTable">
        <thead>
        <tr>
            <th th:text="#{controlhierarchy.table.hierarchy.header}">Hierarchy Level</th>
            <th th:text="#{controlhierarchy.table.nodes.header}">Nodes</th>
            <th th:text="#{controlhierarchy.table.groups.header}">Assigned Groups</th>
            <th th:text="#{controlhierarchy.table.users.header}">Assigned Users</th>
            <th th:text="#{controlhierarchy.table.rules.header}">Assigned Criteria</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <!-- Name with indentation and expand/collapse -->
            <td>
                <span th:style="|padding-left: ${row.level * 2}em|">
                    <a th:if="${row.expanded}"
                       th:href="@{/control_hierarchy(expanded=${row.collapseWith})}"
                       title="Collapse">▼</a>
                    <a th:unless="${row.expanded}"
                       th:href="@{/control_hierarchy(expanded=${row.expandWith})}"
                       title="Expand">▶</a>
                    &nbsp;<span th:text="${row.title}">Node</span>
                </span>
            </td>
            <!-- Node actions -->
            <td>
                <span th:text="${row.childCount}">0</span>
                <a th:if="${row.canAddChild}"
                   th:href="@{/modify_hierarchy_node(nodeId=${row.nodeId}, addingChild=true, expanded=${row.expandWith})}"
                   th:text="#{controlhierarchy.add}" class="inlineLink">Add</a>
                <a th:href="@{/modify_hierarchy_node(nodeId=${row.nodeId}, addingChild=false, expanded=${row.expandWith})}"
                   th:text="#{controlhierarchy.modify}" class="inlineLink">Modify</a>
                <form th:if="${row.canRemove}" method="post" th:action="@{/control_hierarchy/remove}" style="display:inline">
                    <input type="hidden" name="nodeId" th:value="${row.nodeId}"/>
                    <th:block th:each="e : ${row.expandWith}">
                        <input type="hidden" name="expanded" th:value="${e}"/>
                    </th:block>
                    <input type="submit" th:value="#{controlhierarchy.remove}"
                           onclick="SPNR.disableControlsAndSpin(this, null);" style="height:2.1em;margin:0;padding:0"/>
                </form>
            </td>
            <!-- Grupos -->
            <td>
                <span th:text="${row.groupCount}">0</span>
                <a th:if="${row.childCount == 0}"
                   th:href="@{/modify_hierarchy_node_groups(nodeId=${row.nodeId}, expanded=${row.expandWith})}"
                   th:text="#{controlhierarchy.assigngroups}" class="inlineLink">Assign Groups</a>
            </td>
            <!-- Usuarios -->
            <td>
                <span th:text="${row.userCount}">0</span>
                <a th:href="@{/modify_hierarchy_node_perms(nodeId=${row.nodeId}, expanded=${row.expandWith})}"
                   th:text="#{controlhierarchy.assignusers}" class="inlineLink">Assign Users</a>
            </td>
            <!-- Reglas/Criterios -->
            <td>
                <span th:text="${row.ruleCount}">0</span>
                <a th:href="@{/modify_hierarchy_node_rules(nodeId=${row.nodeId}, expanded=${row.expandWith})}"
                   th:text="#{controlhierarchy.assignrules}" class="inlineLink">Assign Criteria</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p style="margin-top:1em">
        <a th:href="@{/administrate}" th:text="#{controlhierarchy.done}">Done</a>
    </p>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
