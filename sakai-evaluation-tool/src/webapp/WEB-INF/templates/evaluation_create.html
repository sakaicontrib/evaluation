<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{starteval.page.title}">Add Evaluation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    [(${sakaiHtmlHead})]
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <!-- Navigation -->
    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <!-- Breadcrumb -->
    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li class="lastCrumbNoFloat" th:text="#{starteval.page.title}">Add Evaluation</li>
    </ul>

    <h3 th:text="#{starteval.header}">Add a new evaluation</h3>

    <div th:if="${errorMessage}" class="alertMessage">
        <ul><li th:text="${errorMessage}">Error</li></ul>
    </div>

    <form th:action="@{/evaluation_create}" method="post">

        <!-- Title -->
        <p th:if="${titleError}" class="alertMessage" th:text="#{general.blank.required.field.user.message1}">Title is required.</p>
        <p class="shorttext">
            <label for="title" th:text="#{starteval.title.header}">Title</label>
            <input type="text" id="title" name="title" size="50" maxlength="255" required="required"/>
        </p>

        <!-- Instrucciones -->
        <div class="longtext evalEditorLarge">
            <label for="instructions" th:text="#{starteval.instructions.header}">Instructions</label>
            <textarea id="instructions" name="instructions" rows="4" cols="60"></textarea>
            <p class="instructionText textPanelFooter">
                <span th:text="#{starteval.instructions.desc}">Will appear at the top of the evaluation.</span>
            </p>
        </div>

        <!-- If a template is already preselected (templateId in URL) -->
        <div th:if="${templateId != null}" class="shorttext">
            <input type="hidden" name="templateId" th:value="${templateId}"/>
            <span th:text="#{evalsettings.template.title.display(${selectedTemplate.title})}">Template: ...</span>
            &nbsp;(<a th:href="@{/preview_eval(templateId=${templateId})}"
                      th:text="#{evalsettings.template.preview.link}">Preview</a>)
        </div>

        <!-- If no template is preselected: show selection table -->
        <div th:if="${templateId == null and hasTemplates}">
            <h4 th:text="#{starteval.choose.template.header}">Choose Template</h4>
            <p class="instructionText" th:text="#{starteval.choose.template.desc}">
                Select the template to use for this evaluation.
            </p>
            <table class="evalsysTable" style="width:60%">
                <thead>
                    <tr>
                        <th th:text="#{starteval.template.title.header}">Template Title</th>
                        <th th:text="#{starteval.template.ownder.header}">Owner</th>
                        <th>&nbsp;</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row,stat : ${templateRows}">
                        <td>
                            <input type="radio" name="templateId" th:id="${'tpl-' + stat.index}"
                                   th:value="${row.id}" th:checked="${stat.first}"/>
                            <label th:for="${'tpl-' + stat.index}" th:text="${row.title}">Title</label>
                        </td>
                        <td th:text="${row.ownerName}">Owner</td>
                        <td class="itemAction">
                            <a th:href="@{/preview_eval(templateId=${row.id})}"
                               th:text="#{starteval.view.preview.link}">Preview</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="act">
            <input type="submit" th:value="#{starteval.continue.settings.link}" class="active"
                   onclick="SPNR.disableControlsAndSpin(this,null);"/>
            <input type="button" th:value="#{general.cancel.button}"
                   onclick="history.go(-1);return false;"/>
        </p>

    </form>

</div>
<script>sakai.editor.launch("instructions", "{noop:0}");</script>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
