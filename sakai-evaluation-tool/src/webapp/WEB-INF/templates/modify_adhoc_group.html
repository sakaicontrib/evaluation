<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="${isNew} ? #{modifyadhocgroup.page.title.new} : #{modifyadhocgroup.page.title.existing(${groupTitle})}">Adhoc Group</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <h3 th:text="${isNew} ? #{modifyadhocgroup.page.title.new} : #{modifyadhocgroup.page.title.existing(${groupTitle})}">Adhoc Group</h3>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alertMessage successMessage">
        <ul><li th:text="#{__${successMessage}__(${successArgs != null ? successArgs[0] : ''})}">OK</li></ul>
    </div>
    <div th:if="${errorMessage}" class="alertMessage">
        <ul><li th:text="#{__${errorMessage}__(${errorArgs != null ? errorArgs[0] : ''})}">Error</li></ul>
    </div>
    <div th:if="${infoMessage}" class="alertMessage informationMessage">
        <ul><li th:text="#{__${infoMessage}__(${infoArgs != null ? infoArgs[0] : ''})}">Info</li></ul>
    </div>

    <p class="instructionText" th:text="#{modifyadhocgroup.message.instructions}">Please enter a group name and list of participants.</p>

    <!-- Current members list — remove forms are INDEPENDENT (not nested inside save form) -->
    <th:block th:unless="${isNew}">
        <p th:if="${#lists.isEmpty(members)}" th:text="#{modifyadhocgroup.message.emptygroup}">No members.</p>
        <div th:unless="${#lists.isEmpty(members)}">
            <p>Click the <b>X</b> by the username or email address to remove it from the adhoc survey group</p>
            <table width="50%">
                <tr th:each="member : ${members}" style="color:#666">
                    <td width="40%">
                        <span th:text="${member.displayName}">Display name</span>
                        (<span th:if="${member.adhocUser}" th:text="#{modifyadhocgroup.adhocuser.label}">Adhoc User</span>
                         <span th:unless="${member.adhocUser}" th:text="${member.displayId}">eid</span>)
                    </td>
                    <td width="20%">
                        <form method="post" th:action="@{/modify_adhoc_group/remove}">
                            <input type="hidden" name="adhocGroupId" th:value="${adhocGroupId}"/>
                            <input type="hidden" name="adhocUserId" th:value="${member.userId}"/>
                            <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>
                            <input type="submit" value="X" onclick="SPNR.disableControlsAndSpin(this, null);"/>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </th:block>

    <!-- Save form — no nested forms inside -->
    <form method="post" th:action="@{/modify_adhoc_group/save}">
        <input type="hidden" th:name="adhocGroupId" th:if="${adhocGroupId != null}" th:value="${adhocGroupId}"/>
        <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>

        <div>
            <p>
                <span th:text="#{modifyadhocgroup.title.label}">Group name:</span>
                <input type="text" name="groupTitle" th:value="${groupTitle}" size="40"/>
            </p>

            <p th:text="#{modifyadhocgroup.message.members}">Enter usernames or emails, one per line.</p>
            <textarea name="newMembers" rows="5" cols="80" th:text="${prefillMembers}"></textarea>

            <p>
                <input type="submit" th:value="${isNew} ? #{modifyadhocgroup.newsave} : #{modifyadhocgroup.update}"
                       onclick="SPNR.disableControlsAndSpin(this, null);"/>
            </p>
        </div>
    </form>

    <a th:href="${returnUrl != null and !#strings.isEmpty(returnUrl)} ? ${returnUrl} : @{/control_adhoc_groups}"
       th:text="#{general.command.cancel}">Cancel</a>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
