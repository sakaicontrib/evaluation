<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{chownevaluation.page.title}">Change Survey Owner</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_evaluations}" th:text="#{controlevaluations.page.title}">My Evaluations</a></li>
        <li class="lastCrumbNoFloat" th:text="#{chownevaluation.page.title}">Change Survey Owner</li>
    </ul>

    <h3 th:text="#{chownevaluation.page.title}">Change Survey Owner</h3>

    <div th:if="${errorMessage != null}" class="alertMessage">
        <ul><li th:text="#{__${errorMessage}__(${eval.title}, '')}">Error</li></ul>
    </div>

    <div class="alertMessage">
        <span th:text="#{chownevaluation.confirm.text(${eval.title})}">Are you sure...?</span>
    </div>

    <div class="act">
        <form method="post" th:action="@{/chown_eval}" class="inlineForm">
            <input type="hidden" name="evaluationId" th:value="${evaluationId}"/>
            <p th:text="#{chownevaluation.chown.text}" class="instructionText">Enter username or email of new owner</p>
            <p>
                <label for="newOwner" th:text="#{chownevaluation.chown.label}">New Owner</label>
                <input type="text" id="newOwner" name="newOwner" size="50" maxlength="255"/>
            </p>
            <input type="submit" th:value="#{chownevaluation.chown.button}" class="active" accesskey="s"/>
        </form>
        <input type="button" th:value="#{general.cancel.button}"
               onclick="javascript:history.go(-1);return false;" accesskey="x"/>
    </div>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
