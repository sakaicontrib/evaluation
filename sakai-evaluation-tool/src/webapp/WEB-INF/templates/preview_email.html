<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{previewemail.page.title}">Preview Email</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_email_templates}" th:text="#{controlemailtemplates.page.title}">Email Templates</a></li>
        <li class="lastCrumbNoFloat" th:text="#{previewemail.page.title}">Preview Email</li>
    </ul>

    <h3 th:text="#{previewemail.header}">Preview of email text</h3>
    <p th:text="#{previewemail.desc}" class="instructionText">Key values will be substituted...</p>

    <div th:utext="#{email.templates.field.names}" class="highlightPanel" style="background:#eee;padding:.5em;margin-bottom:1em"></div>

    <div th:if="${template != null}">
        <p><strong th:text="#{modifyemail.template.subject}">Subject:</strong>
           <span th:text="${template.subject}">Subject text</span></p>
        <div th:utext="${messageHtml}" style="border:1px solid #ccc;padding:1em;background:#fafafa">Message text</div>
    </div>

    <p class="act" style="margin-top:1em">
        <a th:if="${evaluationId != null}"
           th:href="@{/modify_email(templateId=${templateId}, emailType=${emailType}, evaluationId=${evaluationId})}"
           th:text="#{previewemail.modify.button}" class="active">Edit</a>
        <a th:if="${evaluationId != null}"
           th:href="@{/evaluation_settings(evaluationId=${evaluationId})}"
           th:text="#{general.cancel.button}">Back</a>
        <a th:if="${evaluationId == null}"
           th:href="@{/control_email_templates}"
           th:text="#{general.cancel.button}">Back</a>
    </p>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
