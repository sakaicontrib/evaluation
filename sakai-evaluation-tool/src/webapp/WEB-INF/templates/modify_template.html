<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifytemplatetitledesc.page.title}">Edit Template Title/Description</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <!-- Navigation (only in full-page mode) -->
    <th:block th:unless="${inFacebox}">
        <ul th:replace="~{fragments/nav :: navbar}">nav</ul>
        <ul class="breadCrumb">
            <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
            <li><a th:href="@{/control_templates}" th:text="#{controltemplates.page.title}">My Templates</a></li>
            <li class="lastCrumbNoFloat" th:text="#{modifytemplatetitledesc.page.title}">Edit Template</li>
        </ul>
    </th:block>

    <h2 th:unless="${inFacebox}" class="titleHeader pageHeaderOnPage"
        th:text="#{modifytemplatetitledesc.page.title}">Edit Template Title/Description</h2>

    <!-- Empty response for successful modal POST -->
    <div th:fragment="savedOk" style="display:none"></div>

    <!-- Form fragment (also loaded into Bootstrap Modal) -->
    <div th:fragment="basicForm">

        <form id="basic-form" th:action="@{/modify_template}" method="post">
            <input type="hidden" name="templateId" th:if="${templateId != null}" th:value="${templateId}"/>
            <input type="hidden" name="fixedSharing" th:if="${fixedSharingValue != null}" th:value="${fixedSharingValue}"/>

            <p class="shorttext">
                <label for="title" th:text="#{modifytemplatetitledesc.title.header}">Title</label>
                <input type="text" id="title" name="title" maxlength="250" size="50"
                       th:value="${title}" required="required"/>
            </p>

            <div class="longtext">
                <label class="block" for="description"
                       th:text="#{modifytemplatetitledesc.description.header}">Description</label>
                <textarea id="description" name="description" cols="70" rows="3"
                          th:text="${description}"></textarea>
                <p class="instructionText textPanelFooter"
                   th:text="#{modifytemplatetitledesc.description.note}">
                    For you or other admins.
                </p>
            </div>

            <!-- Sharing: dropdown (admin) or fixed label -->
            <p th:if="${showSharingDropdown}" class="longtext">
                <label class="block" for="sharing"
                       th:text="#{modifytemplatetitledesc.sharing.note}">Sharing level</label>
                <select id="sharing" name="sharing">
                    <th:block th:each="val, vStat : ${sharingValues}">
                        <option th:value="${val}"
                                th:selected="${val == currentSharing}"
                                th:text="#{__${sharingLabels[vStat.index]}__}">Sharing option</option>
                    </th:block>
                </select>
            </p>
            <div th:if="${sharingLabelKey != null}"
                 style="font-weight:bold;margin-top:0.5em;"
                 th:text="#{__${sharingLabelKey}__}">Private</div>

            <p class="act">
                <input type="submit" name="saveAction"
                       th:value="#{modifytemplatetitledesc.save.button}"
                       accesskey="s" class="active"
                       th:onclick="${inFacebox} ? 'return true;' : 'if (typeof SPNR !== \'undefined\') SPNR.disableControlsAndSpin(this, null);'"/>
                <!-- Cancel button in modal -->
                <input th:if="${inFacebox}" type="button"
                       class="cancelButtonLightbox"
                       th:value="#{general.cancel.button}"
                       accesskey="x"
                       onclick="var m = document.querySelector('.modal.show'); if (m) bootstrap.Modal.getInstance(m).hide(); return false;"/>
                <!-- Cancel button in full-page mode -->
                <input th:unless="${inFacebox}" type="button"
                       th:value="#{general.cancel.button}"
                       accesskey="x"
                       onclick="history.go(-1)"/>
            </p>
        </form>

    </div>
    <!-- end basicForm fragment -->

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
