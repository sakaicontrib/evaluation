<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{reportgroups.page.title}">Choose Report Groups</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script th:src="@{/content/js/jquery/jquery-1.4.4.min.js}" type="text/javascript"></script>
    <script th:src="@{/content/js/jquery/jquery-ui-1.8.all.min.js}" type="text/javascript"></script>
    <th:block th:replace="~{fragments/evalsys_scripts :: evalsys}"></th:block>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
    <link th:href="@{/content/css/jquery/jquery-ui-1.8.all.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li class="lastCrumbNoFloat" th:text="#{reportgroups.page.title}">Choose Report Groups</li>
    </ul>

    <div th:if="${notAllowed}" class="alertMessage">
        <ul><li th:text="#{viewreport.not.allowed}">Not allowed</li></ul>
    </div>

    <form th:unless="${notAllowed}" name="report_groups_form" method="get" th:action="@{/report_view}">
        <input type="hidden" name="evaluationId" th:value="${evaluationId}"/>

        <p th:text="#{reportgroups.main.message}" class="instructionText">Choose the groups...</p>

        <p class="act">
            <input type="button" th:value="#{modifytemplate.group.add.select.all}"
                   onclick="evalsys.toggleCheckboxes('report_groups_form', true);"/>
            <input type="button" th:value="#{modifytemplate.group.add.select.none}"
                   onclick="evalsys.toggleCheckboxes('report_groups_form', false);"/>
        </p>

        <ol>
            <li th:each="group : ${groups}" class="checkbox">
                <input type="checkbox" name="groupIds" th:value="${group.id}"
                       th:id="'groupCheck-' + ${group.id}" checked="checked"/>
                <label th:for="'groupCheck-' + ${group.id}" th:text="${group.title}">Group name</label>
            </li>
        </ol>

        <p class="act">
            <input type="submit" th:value="#{controlevaluations.active.report.title}" class="active"
                   accesskey="s" onclick="SPNR.disableControlsAndSpin(this, null);"/>
            <input type="button" th:value="#{general.cancel.button}"
                   onclick="SPNR.disableControlsAndSpin(this, null); history.go(-1); return false;"/>
        </p>
    </form>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
