<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{admintesteg.page.title}">Test EvalGroupProvider</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{admintesteg.page.title}">Test EvalGroupProvider</li>
    </ul>

    <!-- Error if no provider is available -->
    <h3 th:if="${warningMessage}" th:text="${warningMessage}" style="color:red;"></h3>

    <th:block th:unless="${warningMessage != null and testResults == null}">

        <div style="width:99%">
            <div class="navPanel">
                <div class="viewNav">
                    <span th:text="#{admintesteg.current.test.header}" style="font-weight:bold">Currently</span> ::
                    <span th:text="#{admintesteg.current.test.user.header}">Username</span>:
                    <span th:text="${currentUsername != null and !currentUsername.isEmpty()} ? ${currentUsername} : 'No username'" style="font-style:italic"></span>
                    &nbsp;
                    <span th:text="#{admintesteg.current.test.group.header}">GroupId</span>:
                    <span th:text="${currentGroupId != null and !currentGroupId.isEmpty()} ? ${currentGroupId} : 'No groupId'" style="font-style:italic"></span>
                </div>
                <div class="listNav">
                    <form method="get" th:action="@{/admin_test_evalgroup_provider}">
                        <label for="usernameInput" th:text="#{admintesteg.current.test.user.header}">Username</label>
                        <input type="text" id="usernameInput" name="username" size="18" maxlength="200"
                               th:value="${currentUsername}"/>
                        &nbsp;
                        <span th:text="#{admintesteg.current.test.group.header}">GroupId</span>
                        <input type="text" name="evalGroupId" size="18" maxlength="200"
                               th:value="${currentGroupId}"/>
                        &nbsp;
                        <input type="submit" th:value="#{admintesteg.test.command}"
                               onclick="SPNR.disableControlsAndSpin(this, null);"/>
                    </form>
                </div>
            </div>
        </div>

        <h3 th:text="#{admintesteg.major.test.header}">Test Results</h3>

        <div th:each="tr : ${testResults}" style="border:1px black solid;margin-bottom:1em;">
            <div style="background-color:lightblue;">
                <span th:text="#{admintesteg.test.method.header}" style="font-weight:bold">Method</span>:
                <span th:text="${tr.method}">methodName</span>
            </div>
            <div>
                <span th:text="#{admintesteg.test.result.header}" style="font-weight:bold">Results</span>:
                <span th:text="${tr.result}">result</span>
            </div>
            <div>
                <span th:text="#{admintesteg.test.runtime.header}" style="font-weight:bold">Time to run</span>:
                <span th:text="#{admintesteg.test.runtime.message(${tr.millis})}">0 milliseconds</span>
            </div>
        </div>

    </th:block>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
