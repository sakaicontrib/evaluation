<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{controlevaladmin.page.title}">Control Eval Admin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script th:src="@{/content/js/jquery/jquery-1.4.4.min.js}" type="text/javascript"></script>
    <script th:src="@{/content/js/evalUtils.js}" type="text/javascript"></script>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{controlevaladmin.page.title}">Control Eval Admin</li>
    </ul>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alertMessage successMessage">
        <ul><li th:text="#{__${successMessage}__(${successArgs != null ? successArgs[0] : ''})}">Success</li></ul>
    </div>
    <div th:if="${errorMessage}" class="alertMessage">
        <ul><li th:text="#{__${errorMessage}__(${errorArgs != null ? errorArgs[0] : ''})}">Error</li></ul>
    </div>

    <p class="instructionText" th:text="#{controlevaladmin.page.note}">Note: Users cannot take away their own admin rights.</p>

    <!-- Eval admins table -->
    <table class="evalsysTable">
        <thead>
        <tr>
            <th th:text="#{controlevaladmin.user.info.header}">User Info</th>
            <th th:text="#{controlevaladmin.assignor.info.header}">Assignor Info</th>
            <th th:text="#{controlevaladmin.actions.header}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Row for assigning a new admin -->
        <tr id="assign-fields">
            <td class="assignEvalAdmin" colspan="2">
                <form method="post" th:action="@{/control_eval_admin/assign}" style="display:inline">
                    <label for="userEidInput" th:text="#{controlevaladmin.user.eid.label}">Assign New Eval Admin:</label>
                    <input type="text" id="userEidInput" name="userEid" class="userEidInput"/>
                    <input type="submit" class="assignButton" th:value="#{controlevaladmin.assign.button}"
                           onclick="SPNR.disableControlsAndSpin(this, null);"/>
                </form>
            </td>
            <td></td>
        </tr>
        <!-- Current admin rows -->
        <tr th:each="row : ${adminRows}">
            <td th:text="${row.displayName + ' (' + row.username + ')'}">User Name (eid)</td>
            <td th:text="#{controlevaladmin.assignor.info(${row.assignorUsername}, ${row.assignDateStr})}">Assigned by... on...</td>
            <td>
                <form th:if="${!row.currentUser}" method="post" th:action="@{/control_eval_admin/unassign}" style="display:inline">
                    <input type="hidden" name="userId" th:value="${row.userId}"/>
                    <input type="submit" class="unassignButton" th:value="#{controlevaladmin.unassign.button}"
                           onclick="SPNR.disableControlsAndSpin(this, null);"/>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Sakai admins table -->
    <table class="evalsysTable" style="margin-top:1em">
        <thead>
        <tr>
            <th th:text="#{controlevaladmin.sakai.admins.header}">Sakai Admins</th>
        </tr>
        <tr>
            <th>
                <span th:text="${sakaiAdminAccessEnabled} ? #{controlevaladmin.sakai.admin.access.status.enabled} : #{controlevaladmin.sakai.admin.access.status.disabled}">
                    Sakai admin access status
                </span>
                <form th:if="${isEvalAdmin || !sakaiAdminAccessEnabled}" method="post" th:action="@{/control_eval_admin/toggle}" style="display:inline">
                    <input type="submit"
                           th:value="${sakaiAdminAccessEnabled} ? #{controlevaladmin.disable.sakai.admin.button} : #{controlevaladmin.enable.sakai.admin.button}"
                           onclick="SPNR.disableControlsAndSpin(this, null);"/>
                </form>
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="admin : ${sakaiAdmins}">
            <td th:text="${admin.displayName + ' (' + admin.username + ')'}">Admin Name (eid)</td>
        </tr>
        </tbody>
    </table>

</div>

<script type="text/javascript">
    EvalSystem.initEvalAdminView();
</script>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
