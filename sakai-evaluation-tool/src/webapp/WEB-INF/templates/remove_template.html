<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{removetemplate.page.title}">Remove Template</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_templates}" th:text="#{controltemplates.page.title}">Templates</a></li>
        <li class="lastCrumbNoFloat" th:text="#{removetemplate.page.title}">Remove Template</li>
    </ul>

    <div th:if="${canRemove}">
        <p th:text="#{removetemplate.confirm.text(${template.title})}" class="instructionText">Are you sure...?</p>
        <form method="post" th:action="@{/remove_template}">
            <input type="hidden" name="templateId" th:value="${templateId}"/>
            <p class="act">
                <input type="submit" th:value="#{removetemplate.remove.button}" class="active"/>
                <a th:href="@{/control_templates}" th:text="#{general.cancel.button}">Cancel</a>
            </p>
        </form>
    </div>

    <div th:unless="${canRemove}" class="alertMessage">
        <p th:text="#{removetemplate.noremove.text(${template.title})}">Cannot remove.</p>
        <a th:href="@{/control_templates}" th:text="#{general.cancel.button}">Cancel</a>
    </div>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
