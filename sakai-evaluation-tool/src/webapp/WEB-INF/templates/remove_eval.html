<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{removeeval.page.title}">Remove Evaluation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_evaluations}" th:text="#{controlevaluations.page.title}">My Evaluations</a></li>
        <li class="lastCrumbNoFloat" th:text="#{removeeval.page.title}">Remove Evaluation</li>
    </ul>

    <p th:text="#{removeeval.confirm.name(${eval.title})}" class="instructionText">Are you sure...?</p>
    <p th:text="#{removeeval.note}" class="instructionText">All data will be removed permanently.</p>

    <table class="listHier lines nolines" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <th th:text="#{removeeval.title.header}">Title</th>
            <th th:text="#{removeeval.start.date.header}">Start Date</th>
            <th th:text="#{removeeval.due.date.header}">Due Date</th>
            <th th:text="#{removeeval.assigned.header}">Assigned</th>
        </tr>
        <tr>
            <td th:text="${eval.title}">Eval title</td>
            <td th:text="${evalStartDate}">01/01/2024</td>
            <td th:text="${evalDueDate}">31/01/2024</td>
            <td>
                <span th:if="${assigned != null}" th:text="${assigned}">Group</span>
                <span th:unless="${assigned != null}" th:text="#{removeeval.assigned.none}">None</span>
            </td>
        </tr>
    </table>

    <form method="post" th:action="@{/remove_eval}">
        <input type="hidden" name="evaluationId" th:value="${evaluationId}"/>
        <p class="act">
            <input type="submit" th:value="#{removeeval.remove.button}" class="active"/>
            <a th:href="@{/control_evaluations}" th:text="#{general.cancel.button}">Cancel</a>
        </p>
    </form>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
