<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{controlscales.page.title}">My Scales</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/webjars/jquery/1.12.4/jquery.min.js"></script>
    <script src="/library/webjars/jquery-ui/1.12.1/jquery-ui.min.js"></script>
    <script src="/library/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="~{fragments/evalsys_scripts :: evalsys}"></th:block>
</head>
<body>
<div class="portletBody evaluation">


    <!-- Navigation bar -->
    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <!-- Breadcrumb -->
    <ul class="breadCrumb">
        <li>
            <a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a>
        </li>
        <li class="lastCrumbNoFloat" th:text="#{controlscales.page.title}">My Scales</li>
        <li class="lastCrumb">
            <a th:href="@{/modify_scale}" class="addItem">
                <span class="bi bi-plus-lg" aria-hidden="true"></span>
                <span th:text="#{controlscales.add.new.scale.link}">Add new scale</span>
            </a>
        </li>
    </ul>

    <h3 th:text="#{controlscales.page.heading}">Scales</h3>
    <p class="instructionText" th:text="#{controlscales.page.instruction}">
        List of scales available. Scales you have created can be edited or removed.
    </p>

    <div th:each="row : ${scaleRows}" style="max-width:55em">
        <table class="evalsysTable" style="width:100%">
            <thead>
                <tr>
                    <th th:text="${row.number}" style="width:3em">1</th>
                    <th th:text="${row.title}">Scale Title</th>
                    <th class="screenOnly" style="text-align:right">
                        <!-- Edit -->
                        <a th:if="${row.canModify}"
                           th:href="@{/modify_scale(scaleId=${row.scaleId})}"
                           th:text="#{general.command.edit}">Edit</a>
                        <span th:unless="${row.canModify}"
                              th:text="#{general.command.edit}"
                              class="inactive">Edit</span>
                        <!-- Delete -->
                        <a th:if="${row.canDelete}"
                           th:href="@{/remove_scale(scaleId=${row.scaleId})}"
                           class="left-separator"
                           th:text="#{general.command.delete}">Delete</a>
                        <span th:unless="${row.canDelete}"
                              th:text="#{general.command.delete}"
                              class="inactive left-separator">Delete</span>
                        <!-- Preview -->
                        <a th:href="@{/preview_scale(scaleId=${row.scaleId})}"
                           class="left-separator preview_scale"
                           th:text="#{general.command.preview}">Preview</a>
                        <!-- Copy -->
                        <form th:action="@{/control_scales/copy}" method="post" class="inlineForm left-separator">
                            <input type="hidden" name="scaleId" th:value="${row.scaleId}"/>
                            <input type="submit" th:value="#{general.copy}" class="makeLink"/>
                        </form>
                    </th>
                </tr>
            </thead>
            <tbody>
                <!-- Scale options -->
                <tr th:each="option : ${row.options}">
                    <td th:text="${option.letter}">a</td>
                    <td th:text="${option.text}">Option</td>
                    <td></td>
                </tr>
                <!-- Ideal point -->
                <tr>
                    <td colspan="3">
                        <strong th:text="#{controlscales.ideal.scale.title}">Ideal scale point:</strong>
                        <span th:text="#{${row.idealKey}}">None</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p th:if="${#lists.isEmpty(scaleRows)}" class="instructionText highlightPanel">
        <!-- No specific i18n key; can be added if needed -->
    </p>

    <!-- Bootstrap Modal for scale preview -->
    <div class="modal fade" id="scaleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="cursor:move">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="scaleModalBody" style="overflow:visible"></div>
            </div>
        </div>
    </div>

</div>
<script type="text/javascript">evalsys.initControlScales();</script>
<th:block th:if="${mainFrameId != ''}"><script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script></th:block>
</body>
</html>
