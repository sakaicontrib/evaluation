<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{administrate.search.page.title}">Administrative Search</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{administrate.search.breadcrumb.title}">Search</li>
    </ul>

    <p class="instructionText" th:text="#{administrate.search.instruction}">Search by evaluation title.</p>

    <!-- Search form -->
    <div class="navPanel">
        <div class="viewNav">
            <form method="get" th:action="@{/administrate_search}">
                <input type="text" name="searchString" size="30" th:value="${searchString}"/>
                <input type="submit" name="searchByTitle" th:value="#{administrate.search.submit.title}"
                       onclick="SPNR.disableControlsAndSpin(this, null);"/>
                &nbsp;
                <input type="submit" name="searchByGroup" th:value="#{administrate.search.submit.title.group}"
                       onclick="SPNR.disableControlsAndSpin(this, null);"/>
            </form>
        </div>

        <!-- Pagination (title search only) -->
        <div th:if="${pagerMsg != null}" class="listNav listPager">
            <span class="listPagerCount" th:text="#{administrate.search.pager.label(${pagerMsg[0]}, ${pagerMsg[1]}, ${pagerMsg[2]})}">
                Viewing x-y of total n
            </span>
            <a th:if="${hasPrev}"
               th:href="@{/administrate_search(searchString=${searchString}, page=${prevPage}, searchGroups=${searchGroups})}"
               title="Previous page" class="pagerButton">&lt;</a>
            <span th:unless="${hasPrev}">&lt;</span>
            <a th:if="${hasNext}"
               th:href="@{/administrate_search(searchString=${searchString}, page=${nextPage}, searchGroups=${searchGroups})}"
               title="Next page" class="pagerButton">&gt;</a>
            <span th:unless="${hasNext}">&gt;</span>
        </div>
    </div>

    <!-- Aviso demasiados grupos -->
    <div th:if="${tooManyGroups}" class="messageInformation">
        <span class="bi bi-info-circle-fill" aria-hidden="true"></span>
        <span th:text="#{administrate.search.results.max(${tooManyGroupsCount})}">Too many sites found.</span>
    </div>

    <!-- Resultados -->
    <table th:if="${evalRows != null and !evalRows.isEmpty()}" class="evalsysTable">
        <thead>
        <tr>
            <th th:text="#{administrate.search.list.title.title}">Title</th>
            <th th:text="#{administrate.search.list.group.id.title}">Group ID</th>
            <th th:text="#{administrate.search.list.start.date.title}">Start Date</th>
            <th th:text="#{administrate.search.list.due.date.title}">Due Date</th>
            <th th:text="#{administrate.search.list.owner}">Owner</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${evalRows}">
            <td>
                <span th:text="${row.title}">Evaluation Title</span>
                (<a th:href="@{/preview_eval(evaluationId=${row.evalId}, templateId=${row.templateId})}"
                    th:text="#{administrate.search.list.preview}">preview</a>)
                (<a th:href="@{/evaluation_settings(evaluationId=${row.evalId})}"
                    th:text="#{administrate.search.list.revise}">revise</a>)
            </td>
            <td>
                <!-- If there is only 1 group show its title; if more, show the count -->
                <a th:if="${row.groupCount == 1}"
                   th:href="@{/evaluation_assignments(evaluationId=${row.evalId})}"
                   th:text="${row.groupText}">Group Name</a>
                <a th:if="${row.groupCount > 1}"
                   th:href="@{/evaluation_assignments(evaluationId=${row.evalId})}"
                   th:text="#{controlevaluations.eval.groups.link(${row.groupCount})}">N groups</a>
                <span th:if="${row.groupCount == 0}">—</span>
            </td>
            <td nowrap="nowrap" th:text="${row.startDate}">Start</td>
            <td nowrap="nowrap" th:text="${row.dueDate}">Due</td>
            <td nowrap="nowrap" th:text="${row.owner}">Owner</td>
        </tr>
        </tbody>
    </table>

    <!-- Sin resultados -->
    <div th:if="${noResults}" class="instructionText">
        <span th:text="#{administrate.search.list.empty.note}">No items found</span>
    </div>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
