<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{expert.category.page.title}">Expert Items - Choose Category</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/modify_template_items(templateId=${templateId})}" th:text="#{modifytemplate.page.title}">Template Items</a></li>
        <li class="lastCrumbNoFloat" th:text="#{expert.category.page.title}">Choose Category</li>
    </ul>

    <!-- Wizard steps indicator -->
    <div style="margin-bottom:1em">
        <span th:text="#{expert.expert.items}">Expert Items</span>:
        <strong th:text="#{expert.choose.category}">(1) Choose Category</strong> |
        <span th:text="#{expert.choose.objective}">(2) Choose Objective</span> |
        <span th:text="#{expert.choose.items}">(3) Choose Items</span>
    </div>

    <h3 th:text="#{expert.category.page.title}">Expert Items - Choose Category</h3>
    <p th:text="#{expert.category.instructions}" class="instructionText">Click on a category...</p>

    <table class="listHier lines" border="0" cellspacing="0" cellpadding="0" width="100%">
        <thead>
            <tr>
                <th th:text="#{expert.category}">Category</th>
                <th th:text="#{expert.description}">Description</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categories}" th:class="${cat.odd ? 'itemsListOddLine' : ''}">
                <td>
                    <a th:href="@{/choose_expert_objective(templateId=${templateId}, categoryId=${cat.id})}"
                       th:text="${cat.title}">Category title</a>
                </td>
                <td>
                    <span th:if="${cat.description != null and !cat.description.isEmpty()}"
                          th:utext="${cat.description}">Description</span>
                    <span th:unless="${cat.description != null and !cat.description.isEmpty()}"
                          th:text="#{expert.no.description}">No description</span>
                </td>
            </tr>
        </tbody>
    </table>

    <p class="act">
        <a th:href="@{/modify_template_items(templateId=${templateId})}" th:text="#{expert.items.cancel}">Cancel</a>
    </p>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
