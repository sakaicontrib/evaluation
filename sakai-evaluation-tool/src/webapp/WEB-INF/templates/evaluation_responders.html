<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{evalresponders.page.title}">Evaluation Responders</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_evaluations}" th:text="#{controlevaluations.page.title}">My Evaluations</a></li>
        <li class="lastCrumbNoFloat" th:text="#{evalresponders.page.title}">Evaluation Responders</li>
    </ul>

    <h3 th:text="#{evalresponders.page.title}">Evaluation Responders</h3>

    <!-- Summary header -->
    <div>
        <span th:text="#{evalresponders.eval.info(${evalTitle}, ${evalStartDate}, ${evalDueDate})}"
              style="font-weight:bold;font-size:1.1em;">Eval info</span>
        <span th:text="#{evalresponders.stats(${totalResponded}, ${totalAssigned})}"
              style="font-weight:bold;">(X responded out of Y)</span>
    </div>
    <div style="margin-top:0.5em">
        <a th:href="${takersDownloadUrl}" th:text="#{viewreport.view.listofevaluationtakers}">Download takers CSV</a>
    </div>
    <div th:if="${showGlobalEmail}" style="margin-top:0.5em">
        <a th:href="@{/evaluation_notifications(evaluationId=${evaluationId})}"
           th:text="#{evalresponders.notifications.link(${evalTitle})}">Send email</a>
    </div>

    <!-- Per-group sections -->
    <div th:each="group : ${groupRows}" style="margin-top:1em">

        <!-- Group header (not shown for anonymous evals) -->
        <div th:unless="${evalAnonymous}">
            <span th:text="#{evalresponders.group.title(${group.groupTitle})}"
                  style="font-weight:bold;">Group: Title</span>
            <span th:text="#{evalresponders.stats(${group.responded}, ${group.assigned})}"
                  style="font-weight:bold;">(X/Y)</span>
            <a th:if="${group.emailGroupId != null}"
               th:href="@{/evaluation_notifications(evaluationId=${evaluationId}, evalGroupId=${group.emailGroupId})}"
               th:text="#{evalresponders.notifications.link(${group.groupTitle})}">Send email</a>
        </div>

        <!-- Responders table -->
        <table th:if="${!group.users.isEmpty()}" style="width:90%" class="evalsysTable">
            <thead>
                <tr>
                    <th th:text="#{evalresponders.user.name}">Name</th>
                    <th th:text="#{evalresponders.status}">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${group.users}">
                    <td th:text="${user.displayName + ' (' + user.username + ')'}">Name (eid)</td>
                    <td>
                        <span th:if="${user.statusKey != null}" th:text="#{__${user.statusKey}__}">Status</span>
                        <span th:unless="${user.statusKey != null}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${group.users.isEmpty()}" th:text="#{evalresponders.no.responses}">No responses yet</p>
    </div>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
