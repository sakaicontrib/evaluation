<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifyexpertitem.page.title}">Add / Edit Expert Item Group</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_expert_items}" th:text="#{controlexpertitems.page.title}">Expert Items</a></li>
        <li class="lastCrumbNoFloat" th:text="#{modifyexpertitem.page.title}">Edit Group</li>
    </ul>

    <h3 th:text="#{modifyexpertitem.page.title}">Add / Edit Expert Item Group</h3>

    <form method="post" th:action="@{/modify_expert_item}">
        <input type="hidden" name="type" th:value="${type}"/>
        <input type="hidden" name="isNew" th:value="${isNew}"/>
        <input type="hidden" th:if="${categoryId != null}" name="categoryId" th:value="${categoryId}"/>
        <input type="hidden" th:if="${objectiveId != null}" name="objectiveId" th:value="${objectiveId}"/>
        <input type="hidden" th:if="${!isNew and !isCategory and categoryId != null}" name="parentId" th:value="${categoryId}"/>
        <input type="hidden" th:if="${isNew and !isCategory and categoryId != null}" name="parentId" th:value="${categoryId}"/>

        <!-- Parent category info for new objectives -->
        <div th:if="${!isCategory and isNew and parentTitle != null}" style="margin-bottom:.5em">
            <label th:text="#{modifyexpertitem.title.cat.label}">Category</label>:
            <span th:text="${parentTitle}">Category Title</span>
        </div>

        <div>
            <label for="title"
                   th:text="${isCategory ? #{modifyexpertitem.title.cat.label} : #{modifyexpertitem.title.obj.label}}">Title</label>
            <input type="text" id="title" name="title" size="50"
                   th:value="${group != null ? group.title : ''}"/>
        </div>
        <div style="margin-top:.5em">
            <label for="description" th:text="#{modifyexpertitem.description.label}">Description</label>
            <input type="text" id="description" name="description" size="80"
                   th:value="${group != null ? group.description : ''}"/>
        </div>

        <p class="act" style="margin-top:1em">
            <input type="submit" th:value="#{modifyexpertitem.save}" class="active"/>
            <a th:href="@{/control_expert_items}" th:text="#{modifyexpertitem.cancel}">Cancel</a>
        </p>
    </form>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
