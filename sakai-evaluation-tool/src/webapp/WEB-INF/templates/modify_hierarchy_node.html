<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifyhierarchynode.breadcrumb.title}">Add / Remove</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li><a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.breadcrumb.title}">Hierarchy</a></li>
        <li class="lastCrumbNoFloat" th:text="#{modifyhierarchynode.breadcrumb.title}">Add / Remove</li>
    </ul>

    <h3 th:text="${addingChild} ? #{modifyhierarchynode.add.location(${locationMsg[0]})} : #{modifyhierarchynode.modify.location(${locationMsg[0]})}">
        Add/Modify Hierarchy Node
    </h3>

    <form method="post" th:action="@{/modify_hierarchy_node/save}" class="inlineBlockForm">
        <input type="hidden" name="nodeId"      th:value="${nodeId}"/>
        <input type="hidden" name="addingChild" th:value="${addingChild}"/>
        <th:block th:each="e : ${expanded}">
            <input type="hidden" name="expanded" th:value="${e}"/>
        </th:block>

        <p class="shorttext">
            <label for="node-title" th:text="#{modifyhierarchynode.title.label}">Title</label>
            <input type="text" id="node-title" name="title" th:value="${addingChild ? '' : nodeCurrentTitle}"/>
        </p>
        <p class="shorttext">
            <label for="node-abbr" th:text="#{modifyhierarchynode.abbreviation.label}">Abbreviation</label>
            <input type="text" id="node-abbr" name="description" th:value="${addingChild ? '' : nodeDescription}"/>
        </p>

        <div class="act">
            <a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.return.link}">Return to Hierarchy</a>
            <input type="submit" th:value="#{modifyhierarchynode.save}" class="active" accesskey="s"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
        </div>
    </form>

</div>
<script type="text/javascript">document.getElementById('node-title').focus();</script>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
