<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{controlreporting.page.title}">Control Reporting</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li class="lastCrumbNoFloat" th:text="#{controlreporting.page.title}">Control Reporting</li>
    </ul>

    <h3 th:text="#{controlreporting.page.title}">Control Reporting</h3>

    <form method="post" th:action="@{/administrate_reporting}">
        <fieldset class="visibleFS">
            <legend th:text="#{controlreporting.exportformats.fieldtitle}">Enabled Export Formats</legend>

            <p class="checkbox indnt1">
                <input type="checkbox" id="enableCsvExport" name="enableCsvExport" value="true"
                       th:checked="${enableCsvExport}"/>
                <label for="enableCsvExport" th:text="#{controlreporting.enable.csv.label}">Enable CSV Export</label>
            </p>
            <p class="checkbox indnt1">
                <input type="checkbox" id="enableXlsExport" name="enableXlsExport" value="true"
                       th:checked="${enableXlsExport}"/>
                <label for="enableXlsExport" th:text="#{controlreporting.enable.xls.label}">Enable XLS Export</label>
            </p>
            <p class="checkbox indnt1">
                <input type="checkbox" id="enablePdfExport" name="enablePdfExport" value="true"
                       th:checked="${enablePdfExport}"/>
                <label for="enablePdfExport" th:text="#{controlreporting.enable.pdf.label}">Enable PDF Export</label>
            </p>
            <p class="checkbox indnt1">
                <input type="checkbox" id="enableListOfTakers" name="enableListOfTakers" value="true"
                       th:checked="${enableListOfTakers}"/>
                <label for="enableListOfTakers" th:text="#{controlreporting.enable.list.of.takers.label}">Enable List of Takers Export</label>
            </p>
        </fieldset>

        <fieldset class="visibleFS">
            <legend th:text="#{controlreporting.pdfoptions.fieldtitle}">PDF Options</legend>

            <p class="checkbox indnt1">
                <input type="checkbox" id="enablePdfBanner" name="enablePdfBanner" value="true"
                       th:checked="${enablePdfBanner}"/>
                <label for="enablePdfBanner" th:text="#{controlreporting.enable.pdfbanner.label}">Include Banner Image on PDF</label>
            </p>
            <p class="longtext indnt1">
                <label for="pdfBannerLocation" class="block" th:text="#{controlreporting.pdfbanner.location.label}">
                    Resources path to image. (Be sure the image is publicly viewable)
                </label>
                <input type="text" id="pdfBannerLocation" name="pdfBannerLocation" size="60"
                       th:value="${pdfBannerLocation}"/>
            </p>
        </fieldset>

        <p class="act">
            <input type="submit" class="active" th:value="#{controlreporting.save}" accesskey="s"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
            <input type="button" th:value="#{controlreporting.cancel}" accesskey="x"
                   onclick="SPNR.disableControlsAndSpin(this, null); history.go(-1);"/>
        </p>
    </form>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
