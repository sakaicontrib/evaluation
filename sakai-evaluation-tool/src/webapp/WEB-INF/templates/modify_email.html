<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifyemail.page.title}">Edit Email Template</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/control_email_templates}" th:text="#{controlemailtemplates.page.title}">Email Templates</a></li>
        <li class="lastCrumbNoFloat" th:text="#{modifyemail.page.title}">Edit Email Template</li>
    </ul>

    <h3 th:text="#{modifyemail.modify.template.header(${emailType})}">Edit email template</h3>

    <div th:utext="#{email.templates.field.names}" class="highlightPanel" style="background:#eee;padding:.5em;margin-bottom:1em"></div>

    <form method="post" th:action="@{/modify_email}">
        <input type="hidden" th:if="${templateId != null}" name="templateId" th:value="${templateId}"/>
        <input type="hidden" th:if="${emailType != null}" name="emailType" th:value="${emailType}"/>
        <input type="hidden" th:if="${evaluationId != null}" name="evaluationId" th:value="${evaluationId}"/>

        <p th:text="#{modifyemail.modify.text.instructions}" class="instructionText">Edit the text...</p>

        <div>
            <label for="emailSubject" th:text="#{modifyemail.template.subject}">Subject:</label>
            <input type="text" id="emailSubject" name="subject" size="80" maxlength="250"
                   th:value="${template != null ? template.subject : ''}"/>
        </div>
        <div style="margin-top:.5em">
            <textarea name="message" rows="20" cols="120" id="emailMessage"
                      th:text="${template != null ? template.message : ''}"></textarea>
        </div>

        <p class="act">
            <input type="submit" th:value="#{modifyemail.save.changes.link}" class="active"/>
            <a th:if="${standalone}" th:href="@{/control_email_templates}"
               th:text="#{general.cancel.button}">Cancel</a>
            <a th:unless="${standalone}" href="javascript:history.go(-1)"
               th:text="#{general.cancel.button}">Cancel</a>
        </p>
    </form>

    <!-- Reset to default (only when editing a non-default template linked to an eval) -->
    <form th:if="${canReset}" method="post" th:action="@{/modify_email/reset}" style="margin-top:.5em">
        <input type="hidden" name="evaluationId" th:value="${evaluationId}"/>
        <input type="hidden" name="emailType" th:value="${emailType}"/>
        <input type="submit" th:value="#{modifyemail.reset.to.default.link}" class="negative"/>
    </form>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
