<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Preview Scale</title>
</head>
<body>

<!-- th:fragment="content" is returned by the controller as "preview_scale :: content" -->
<div th:fragment="content" class="evaluation preview-item">

    <!-- Badge: view migrated to Spring MVC+Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <div id="items_container">

        <th:block th:each="section, sIdx : ${sections}">

            <!-- Accordion header -->
            <h3><a href="#" th:text="${section.title}">Scale Display</a></h3>

            <!-- Accordion content: one item per display mode -->
            <div style="min-width:200px; max-width:800px">
                <div class="item scale">

                    <!-- ==================== COMPACT / COMPACT COLORED ==================== -->
                    <th:block th:if="${section.displaySetting == 'Compact' or section.displaySetting == 'CompactColored'}">
                        <div th:class="${section.displaySetting == 'CompactColored'} ? 'compact compact-colored' : 'compact'">
                            <h5 class="title">
                                <span class="number">1</span>
                                <span class="delineator"><span class="dot">.</span></span>
                                <span class="label" th:text="${section.questionText}">Question text</span>
                            </h5>
                            <div class="content">
                                <table border="0" cellspacing="0" cellpadding="0" width="100%" class="itemScalePanel">
                                    <tr>
                                        <td width="5%" nowrap="nowrap"
                                            th:classappend="${section.startClass}"
                                            class="compactDisplayStartGeneric">
                                            <span th:text="${section.startLabel}">start</span>
                                        </td>
                                        <td width="89%" nowrap="nowrap" class="idealScale"
                                            th:style="${section.displaySetting == 'CompactColored'} ? '' : 'height:27px;overflow:hidden;'">
                                            <div th:if="${section.displaySetting == 'CompactColored'}" class="scaleChoiceColored">
                                                <label th:each="o : ${section.options}" class="scaleItemLabel">
                                                    <span class="blockChoice skip"></span>
                                                    <input type="radio" disabled="disabled"
                                                           th:attr="name='radio-' + ${sIdx.index} + 'c',value=${o.value}"
                                                           class="scaleItemInput"/>
                                                </label>
                                            </div>
                                            <div th:unless="${section.displaySetting == 'CompactColored'}" class="scaleChoiceNotColored">
                                                <label th:each="o : ${section.options}" class="scaleItemLabel">
                                                    <span class="blockChoice skip"></span>
                                                    <input type="radio" disabled="disabled"
                                                           th:attr="name='radio-' + ${sIdx.index},value=${o.value}"
                                                           class="scaleItemInput"/>
                                                </label>
                                            </div>
                                        </td>
                                        <td width="5%" nowrap="nowrap"
                                            th:classappend="${section.endClass}"
                                            class="compactDisplayEndGeneric">
                                            <span th:text="${section.endLabel}">end</span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </th:block>

                    <!-- ==================== FULL ==================== -->
                    <th:block th:if="${section.displaySetting == 'Full'}">
                        <div>
                            <h5 class="title">
                                <span class="number">1</span>
                                <span class="delineator"><span class="dot">.</span></span>
                                <span class="label" th:text="${section.questionText}">Question text</span>
                            </h5>
                            <div style="padding:0;">
                                <table border="0" cellspacing="0" cellpadding="0" width="100%"
                                       class="fullDisplayHorizontalScale fullDisplayHorizontal">
                                    <tr>
                                        <td th:each="o : ${section.options}" nowrap="nowrap" align="center" style="height:24px;">
                                            <span style="padding:.3em .5em">
                                                <label th:for="${'full-' + sIdx.index + '-' + o.index}"
                                                       style="font-weight:bold;" th:text="${o.label}">label</label>
                                                <input type="radio" disabled="disabled"
                                                       th:id="${'full-' + sIdx.index + '-' + o.index}"
                                                       th:attr="name='radio-' + ${sIdx.index},value=${o.value}"/>
                                            </span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </th:block>

                    <!-- ==================== FULL COLORED ==================== -->
                    <th:block th:if="${section.displaySetting == 'FullColored'}">
                        <div>
                            <h5 class="title">
                                <span class="number">1</span>
                                <span class="delineator"><span class="dot">.</span></span>
                                <span class="label" th:text="${section.questionText}">Question text</span>
                            </h5>
                            <div style="padding:0;">
                                <table border="0" cellspacing="0" cellpadding="0" rules="none" width="100%">
                                    <tr>
                                        <td nowrap="nowrap" valign="middle" class="fullDisplayHorizontalColoredWrapper">
                                            <table border="0" cellspacing="0" cellpadding="0" width="100%"
                                                   class="fullDisplayHorizontal fullDisplayHorizontalScale fullDisplayHorizontalColored">
                                                <tr>
                                                    <td th:each="o : ${section.options}">
                                                        <span style="padding:.2em .5em">
                                                            <label th:for="${'fullc-' + sIdx.index + '-' + o.index}"
                                                                   th:text="${o.label}">label</label>
                                                            <input type="radio" disabled="disabled"
                                                                   th:id="${'fullc-' + sIdx.index + '-' + o.index}"
                                                                   th:attr="name='radio-' + ${sIdx.index},value=${o.value}"/>
                                                        </span>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </th:block>

                    <!-- ==================== VERTICAL ==================== -->
                    <th:block th:if="${section.displaySetting == 'Vertical'}">
                        <div>
                            <h5 class="title">
                                <span class="number">1</span>
                                <span class="delineator"><span class="dot">.</span></span>
                                <span class="label" th:text="${section.questionText}">Question text</span>
                            </h5>
                            <div class="fullVertical">
                                <ul class="fullVertical mult-choice-ans">
                                    <li th:each="o : ${section.options}" class="check">
                                        <label>
                                            <input type="radio" disabled="disabled"
                                                   th:id="${'vert-' + sIdx.index + '-' + o.index}"
                                                   th:attr="name='radio-' + ${sIdx.index},value=${o.value}"/>
                                            <span th:text="${o.label}">label</span>
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </th:block>

                    <!-- ==================== MATRIX ==================== -->
                    <th:block th:if="${section.displaySetting == 'Matrix' or section.displaySetting == 'MatrixColored'}">
                        <div class="matrixDisplay scale">
                            <div class="matrix">
                                <h5 class="title">
                                    <span class="number">1</span>
                                    <span class="delineator"><span class="dot">.</span></span>
                                    <span class="label" th:text="${section.questionText}">Question text</span>
                                </h5>
                                <div class="content">
                                    <fieldset>
                                        <legend>
                                            <span class="response-type" th:text="#{previewscale.scale.response.type}">Scale Response:</span>
                                            <span class="response-scale-start" th:text="${section.matrixLabelStart}">start</span>
                                            <th:block th:if="${section.matrixLabelMiddle != null}">
                                                <span class="response-scale-delineator"> - </span>
                                                <span class="response-scale-middle" th:text="${section.matrixLabelMiddle}">middle</span>
                                            </th:block>
                                            <span class="response-scale-delineator"> - </span>
                                            <span class="response-scale-end" th:text="${section.matrixLabelEnd}">end</span>
                                        </legend>
                                        <div class="response-list">
                                            <ol th:class="'response-list matrixRadioItems-' + ${#lists.size(section.options)}">
                                                <li th:each="o : ${section.options}">
                                                    <label>
                                                        <span th:text="${o.label}">1</span>
                                                        <input type="radio" disabled="disabled"
                                                               th:attr="name='radio-' + ${sIdx.index},value=${o.value}"/>
                                                    </label>
                                                </li>
                                            </ol>
                                        </div>
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                    </th:block>

                    <!-- ==================== STEPPED / STEPPED COLORED ==================== -->
                    <th:block th:if="${section.displaySetting == 'Stepped' or section.displaySetting == 'SteppedColored'}">
                        <table border="0" cellspacing="0" cellpadding="0" width="99%" class="steppedItemGroup">
                            <tr>
                                <td>
                                    <!-- Row: label + corner + middle images (options in reverse order) -->
                                    <div th:each="row : ${section.steppedRows}" class="pull-right blockRowBranch">
                                        <label style="font-weight:bold;" th:text="${row.label}">choice</label>&nbsp;
                                        <img th:src="@{/content/images/corner.gif}" align="top" alt="corner arrow segment"/>
                                        <th:block th:if="${row.middleCount > 0}">
                                            <span th:each="k : ${#numbers.sequence(1, row.middleCount)}">
                                                <img th:src="@{/content/images/down-line.gif}" align="top" alt="downward arrow segment"/>
                                            </span>
                                        </th:block>
                                    </div>
                                    <!-- Bottom arrow (one per option) -->
                                    <div class="pull-right blockRowBranch">
                                        <span th:each="row : ${section.steppedRows}">
                                            <img th:src="@{/content/images/down-arrow.gif}" align="top" alt="down arrow pointer"/>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="exclude answerCell">
                                    <table border="0" cellspacing="0" cellpadding="0" width="100%">
                                        <tr>
                                            <td width="90%" valign="top">
                                                <span class="numberWrapper">
                                                    <span class="number">1</span><span class="dot">.</span>
                                                </span>
                                                <div style="display:inline" class="steppedLabel" th:text="${section.questionText}">question</div>
                                            </td>
                                            <td align="right" nowrap="nowrap" style="height:27px;overflow:hidden;" class="last exclude choiceGroup">
                                                <!-- colour overlay (SteppedColored only) -->
                                                <th:block th:if="${section.displaySetting == 'SteppedColored'}">
                                                    <div style="width:100%;position:relative;">
                                                        <div style="width:100%;display:block;position:absolute;z-index:5;">
                                                            <img th:src="@{${section.idealImageUrl}}" style="width:100%;height:28px;" alt="ideal coloring image"/>
                                                        </div>
                                                        <div class="blockChoiceColored" style="position:relative;z-index:6;">
                                                            <label th:each="o : ${section.options}" class="blockItemLabel">
                                                                <span class="blockChoice"></span>
                                                                <input type="radio" disabled="disabled"
                                                                       th:attr="name='radio-' + ${sIdx.index} + 'c',value=${o.value}"
                                                                       class="blockItemChoice"/>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </th:block>
                                                <!-- actual radio inputs (Stepped only; hidden for SteppedColored) -->
                                                <div th:unless="${section.displaySetting == 'SteppedColored'}" class="blockChoiceNotColored">
                                                    <label th:each="o : ${section.options}" class="blockItemLabel">
                                                        <span class="blockChoice"></span>
                                                        <input type="radio" disabled="disabled"
                                                               th:attr="name='radio-' + ${sIdx.index},value=${o.value}"
                                                               class="blockItemChoice"/>
                                                    </label>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </th:block>

                </div><!-- end item scale -->
            </div><!-- end accordion content -->

        </th:block><!-- end section loop -->

    </div><!-- end items_container -->

    <script type="text/javascript">evalsys.initPreviewScales();</script>
</div>

</body>
</html>
