<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{hierarchynode.groups.breadcrumb.title}">Assign Groups</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script th:src="@{/content/js/jquery/jquery-1.4.4.min.js}" type="text/javascript"></script>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li><a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.breadcrumb.title}">Hierarchy</a></li>
        <li class="lastCrumbNoFloat" th:text="#{hierarchynode.groups.breadcrumb.title}">Assign Groups</li>
    </ul>

    <h3 th:text="#{hierarchynode.groups.body.title(${nodeTitle})}">Assign groups for node</h3>

    <form method="post" th:action="@{/modify_hierarchy_node_groups/save}" class="inlineBlockForm">
        <input type="hidden" name="nodeId" th:value="${nodeId}"/>
        <th:block th:each="e : ${expanded}">
            <input type="hidden" name="expanded" th:value="${e}"/>
        </th:block>

        <div class="action">
            <a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.return.link}">Return</a>
            <input type="submit" th:value="#{hierarchynode.groups.save}" class="active" accesskey="s"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
        </div>

        <table class="evalsysTable">
            <thead>
            <tr>
                <th>
                    <input type="checkbox" id="selectAllNone"/>
                    <span th:text="#{hierarchynode.groups.table.select}">Select</span>
                </th>
                <th th:text="#{hierarchynode.groups.table.title}">Title</th>
                <th th:text="#{hierarchynode.groups.table.sections}">Sections</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row,stat : ${groupRows}" th:classappend="${stat.odd} ? 'oddrow' : ''">
                <td>
                    <input type="checkbox" name="selectedGroups" th:id="${'g-' + stat.index}"
                           th:value="${row.evalGroupId}" th:checked="${row.selected}"/>
                </td>
                <td>
                    <label th:for="${'g-' + stat.index}" th:text="${row.title}">Group</label>
                </td>
                <td th:text="${row.sections}">Sections</td>
            </tr>
            </tbody>
        </table>

        <div class="action" style="margin-top:0.5em">
            <a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.return.link}">Return</a>
            <input type="submit" th:value="#{hierarchynode.groups.save}" class="active" accesskey="s"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
        </div>
    </form>

</div>
<script type="text/javascript">
$(document).ready(function () {
    $('#selectAllNone').change(function () {
        $('input[name=selectedGroups]').prop('checked', this.checked);
    });
});
</script>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
