<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{modifynoderules.page.title}">Hierarchy Node Criteria</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
    <script src="/library/js/spinner.js" type="text/javascript"></script>
</head>
<body>
<div class="portletBody evaluation">

    <!-- Badge: view migrated to Spring MVC + Thymeleaf -->
    <span style="float:right;background:#d45800;color:#fff;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:10px;margin:2px 0 4px 8px;opacity:.9;">&#127807; Thymeleaf</span>

    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li><a th:href="@{/administrate}" th:text="#{administrate.page.title}">Administrate</a></li>
        <li><a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.breadcrumb.title}">Hierarchy</a></li>
        <li class="lastCrumbNoFloat" th:text="#{modifynoderules.breadcrumb.title}">Modify Node Criteria</li>
    </ul>

    <!-- Flash messages -->
    <div th:if="${errorMessage}" class="alertMessage">
        <ul><li th:text="#{__${errorMessage}__}">Error</li></ul>
    </div>

    <h3 th:text="#{modifynoderules.page.title}">Modify Hierarchy Node Criteria</h3>
    <p th:text="#{modifynoderules.node.info(${nodeTitle}, ${nodeDesc})}">Node info</p>
    <p class="instructionText" th:text="#{modifynoderules.instructions.1}">Instructions 1</p>
    <p class="instructionText" th:text="#{modifynoderules.instructions.2}">Instructions 2</p>

    <p>
        <a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.return.link}">Return</a>
    </p>

    <!-- Reglas existentes -->
    <table th:unless="${#lists.isEmpty(rules)}" class="evalsysTable" style="margin-bottom:1em">
        <thead>
        <tr>
            <th th:text="#{modifynoderules.rule.header}">Criteria</th>
            <th th:text="#{modifynoderules.actions.header}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rule : ${rules}">
            <td>
                <form method="post" th:action="@{/modify_hierarchy_node_rules/update}" style="display:inline-block">
                    <input type="hidden" name="nodeId" th:value="${nodeId}"/>
                    <input type="hidden" name="ruleId" th:value="${rule.ruleId}"/>
                    <th:block th:each="e : ${expanded}">
                        <input type="hidden" name="expanded" th:value="${e}"/>
                    </th:block>
                    <select name="option">
                        <option th:each="i : ${#numbers.sequence(0, optionValues.length - 1)}"
                                th:value="${optionValues[i]}"
                                th:text="${#messages.msg(optionLabels[i])}"
                                th:selected="${optionValues[i] == rule.option}">Option</option>
                    </select>
                    <select name="qualifier">
                        <option th:each="i : ${#numbers.sequence(0, qualifierValues.length - 1)}"
                                th:value="${qualifierValues[i]}"
                                th:text="${#messages.msg(qualifierLabels[i])}"
                                th:selected="${qualifierValues[i] == rule.qualifier}">Qualifier</option>
                    </select>
                    <input type="text" name="ruleText" th:value="${rule.ruleText}" size="25"/>
                    <input type="submit" th:value="#{modifynoderules.save.changes.button}" class="active"
                           onclick="SPNR.disableControlsAndSpin(this, null);"/>
                </form>
            </td>
            <td>
                <form method="post" th:action="@{/modify_hierarchy_node_rules/remove}" style="display:inline">
                    <input type="hidden" name="nodeId" th:value="${nodeId}"/>
                    <input type="hidden" name="ruleId" th:value="${rule.ruleId}"/>
                    <th:block th:each="e : ${expanded}">
                        <input type="hidden" name="expanded" th:value="${e}"/>
                    </th:block>
                    <input type="submit" th:value="#{modifynoderules.remove.rule.button}"
                           onclick="SPNR.disableControlsAndSpin(this, null);"/>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Add new rule -->
    <form method="post" th:action="@{/modify_hierarchy_node_rules/add}" class="inlineBlockForm">
        <input type="hidden" name="nodeId" th:value="${nodeId}"/>
        <th:block th:each="e : ${expanded}">
            <input type="hidden" name="expanded" th:value="${e}"/>
        </th:block>
        <p>
            <select name="option">
                <option th:each="i : ${#numbers.sequence(0, optionValues.length - 1)}"
                        th:value="${optionValues[i]}"
                        th:text="${#messages.msg(optionLabels[i])}">Option</option>
            </select>
            <select name="qualifier">
                <option th:each="i : ${#numbers.sequence(0, qualifierValues.length - 1)}"
                        th:value="${qualifierValues[i]}"
                        th:text="${#messages.msg(qualifierLabels[i])}">Qualifier</option>
            </select>
            <input type="text" name="ruleText" size="25" placeholder="Rule text"/>
            <input type="submit" th:value="#{modifynoderules.add.rule.button}" class="active"
                   onclick="SPNR.disableControlsAndSpin(this, null);"/>
        </p>
    </form>

    <p>
        <a th:href="@{/control_hierarchy(expanded=${expanded})}" th:text="#{controlhierarchy.return.link}">Return</a>
    </p>

</div>
<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>
</body>
</html>
