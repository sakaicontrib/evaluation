<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title th:text="#{removeitem.page.title}">Remove Item</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="/library/js/headscripts.js" type="text/javascript"></script>
    <link th:href="${skinRepo + '/tool_base.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="${skinRepo + '/' + skinDefault + '/tool.css'}" type="text/css" rel="stylesheet" media="screen"/>
    <link th:href="@{/content/css/evaluation_base.css}" type="text/css" rel="stylesheet" media="all"/>
</head>
<body>
<div class="portletBody evaluation">


    <ul th:replace="~{fragments/nav :: navbar}">nav</ul>

    <ul class="breadCrumb">
        <li><a th:href="@{/summary}" th:text="#{summary.page.title}">Summary</a></li>
        <li th:if="${isTemplateItem}">
            <a th:href="@{/modify_template_items(templateId=${templateId})}"
               th:text="#{modifytemplateitems.page.title}">Template Items</a>
        </li>
        <li th:unless="${isTemplateItem}">
            <a th:href="@{/control_items}" th:text="#{controlitems.page.title}">Items</a>
        </li>
        <li class="lastCrumbNoFloat" th:text="#{removeitem.page.title}">Remove Item</li>
    </ul>

    <p th:text="#{removeitem.templateitem.confirmation}" th:if="${isTemplateItem}" class="instructionText">Are you sure...?</p>
    <p th:text="#{removeitem.item.confirmation}" th:unless="${isTemplateItem}" class="instructionText">Are you sure...?</p>

    <p th:if="${isBlockParent}" th:text="#{removeitem.block.text}" class="instructionText">Block items will be split.</p>

    <div class="itemListReport" style="margin:1em 0;padding:1em;border:1px solid #ccc">
        <span th:utext="${itemText}">Item text here</span>
    </div>

    <form method="post" th:action="@{/remove_item}">
        <input type="hidden" name="itemId"         th:if="${itemId != null}"         th:value="${itemId}"/>
        <input type="hidden" name="templateItemId" th:if="${templateItemId != null}" th:value="${templateItemId}"/>
        <input type="hidden" name="templateId"     th:if="${templateId != null}"     th:value="${templateId}"/>
        <p class="act">
            <input type="submit" th:value="#{removeitem.remove.item.button}" class="active"/>
            <a th:if="${isTemplateItem}"
               th:href="@{/modify_template_items(templateId=${templateId})}"
               th:text="#{general.cancel.button}">Cancel</a>
            <a th:unless="${isTemplateItem}"
               th:href="@{/control_items}"
               th:text="#{general.cancel.button}">Cancel</a>
        </p>
    </form>

</div>

<th:block th:if="${mainFrameId != ''}">
    <script th:inline="javascript">setMainFrameHeight([[${mainFrameId}]]);</script>
</th:block>

</body>
</html>
