name: Sakai Tomcat Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  sakai-tomcat:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TERM: xterm
      MAVEN_VERSION: "3.9.16"
      MAVEN_ARGS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
      JAVA_OPTS: "-Dhttp.agent=Sakai -Xms2512m -Xmx2512m -Dsakai.cookieName=SAKAIID -Dsakai.demo=true"
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true -Dmaven.wagon.http.retryHandler.count=2 -Dmaven.wagon.http.pool=true"
      PLAYWRIGHT_BROWSER: chromium
      TOMCAT_DIR: "${{ github.workspace }}/tomcat"
      TOMCAT_VERSION: "10.1.61"

    steps:
      - name: Checkout evaluation tool
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest Sakai
        uses: actions/checkout@v7
        with:
          repository: sakaiproject/sakai
          ref: master
          path: sakai
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Provision Tomcat and database
        run: |
          sudo systemctl start mysql.service
          echo "127.0.0.1 repository.dev.java.net" | sudo tee -a /etc/hosts
          echo "127.0.0.1 maven-repository.dev.java.net" | sudo tee -a /etc/hosts
          echo "127.0.0.1 maven2-repository.dev.java.net" | sudo tee -a /etc/hosts
          mkdir -p "${TOMCAT_DIR}"
          pushd "${TOMCAT_DIR}"
          curl --fail --show-error --location --retry 3 -o tomcat.tar.gz "https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz"
          tar --strip-components=1 -xzf tomcat.tar.gz
          git clone https://github.com/sakaiproject/nightly-config.git sakai
          cp sakai/setenv.sh bin/setenv.sh
          cp sakai/cypress.properties sakai/sakai.properties
          sed -i '/DEBUG/d' sakai/sakai.properties
          cp -f sakai/context.xml conf/context.xml
          cp -f sakai/catalina.properties conf/catalina.properties
          sed -i 's:<Service name="Catalina">:<Service name="Catalina"><Connector port="8443" protocol="org.apache.coyote.http11.Http11NioProtocol" scheme="https" secure="true" />:g' conf/server.xml
          popd
          mysql -u root -proot -e "DROP DATABASE IF EXISTS sakai; CREATE DATABASE sakai;"

      - name: Restore master Maven repository cache
        id: maven-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .m2/repository
          enableCrossOsArchive: true
          key: evalsys-m2-sakai-master-maven-${{ env.MAVEN_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: evalsys-m2-sakai-master-maven-${{ env.MAVEN_VERSION }}-

      - name: Report Maven cache status
        env:
          MATCHED_CACHE_KEY: ${{ steps.maven-cache.outputs.cache-matched-key }}
        run: echo "Restored Maven cache = ${MATCHED_CACHE_KEY:-none}"

      - name: Bootstrap dependencies absent from Maven Central
        run: |
          (cd .github/maven-seed && sha256sum --check --strict SHA256SUMS)
          for pom in "${GITHUB_WORKSPACE}"/.github/maven-seed/*.pom; do
            mvn --batch-mode --no-transfer-progress --non-recursive -f sakai/master/pom.xml \
              org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
              -Dfile="${pom%.pom}.jar" -DpomFile="${pom}"
          done

      - name: Build Sakai master and deploy to Tomcat
        id: build-sakai
        working-directory: sakai
        run: mvn --batch-mode -DskipTests -Dmaven.source.skip install sakai:deploy-exploded -Dmaven.tomcat.home="${TOMCAT_DIR}"

      - name: Build evaluation tool and deploy to Tomcat
        run: mvn --batch-mode install sakai:deploy-exploded -Dmaven.tomcat.home="${TOMCAT_DIR}"

      - name: Remove failed-download markers from Maven cache
        if: always() && steps.maven-cache.outcome == 'success'
        run: find .m2/repository -type f -name '*.lastUpdated' -delete

      - name: Save Maven repository cache
        if: always() && steps.maven-cache.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: .m2/repository
          enableCrossOsArchive: true
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Start Tomcat and verify startup
        run: |
          touch "${TOMCAT_DIR}/logs/catalina.out"
          bash "${TOMCAT_DIR}/bin/catalina.sh" start
          if ! timeout 600 bash -c 'until grep -q "Server startup in" "'"${TOMCAT_DIR}/logs/catalina.out"'"; do sleep 10; done'; then
            echo "Tomcat failed to report startup within 10 minutes" >&2
            tail -n 200 "${TOMCAT_DIR}/logs/catalina.out" || true
            exit 1
          fi
          if ! timeout 300 bash -c 'until curl --fail --silent --show-error --max-time 60 http://localhost:8080/portal/ > /tmp/portal.html; do sleep 10; done'; then
            echo "Sakai portal did not become available at /portal/" >&2
            echo "--- catalina.out (tail) ---" >&2
            tail -n 200 "${TOMCAT_DIR}/logs/catalina.out" >&2 || true
            echo "--- webapps ---" >&2
            ls -la "${TOMCAT_DIR}/webapps" >&2 || true
            exit 1
          fi
          tail -n 20 "${TOMCAT_DIR}/logs/catalina.out"

      - name: Set up Node for Playwright
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Resolve Playwright Java version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(mvn --batch-mode --no-transfer-progress -q -Pe2e -pl e2e-tests help:evaluate -Dexpression=playwright.version -DforceStdout | tail -n1)
          echo "value=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-java-${{ steps.playwright-version.outputs.value }}

      - name: Install Playwright
        run: |
          mkdir -p .playwright-cli
          cat > .playwright-cli/package.json <<'EOF'
          {
            "name": "evaluation-playwright-cli",
            "private": true
          }
          EOF
          npm --prefix .playwright-cli install --no-audit --no-fund --save-exact playwright@${{ steps.playwright-version.outputs.value }}
          ./.playwright-cli/node_modules/.bin/playwright install-deps chromium
          ./.playwright-cli/node_modules/.bin/playwright install chromium

      - name: Run Playwright e2e tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: |
          set -o pipefail
          mkdir -p e2e-tests/target
          mvn --batch-mode --no-transfer-progress -Pe2e -pl e2e-tests test 2>&1 | tee e2e-tests/target/playwright-run.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evaluation-playwright-artifacts
          path: |
            e2e-tests/target/playwright-artifacts
            e2e-tests/target/surefire-reports
            e2e-tests/target/playwright-run.log
            tomcat/logs/
          if-no-files-found: ignore
          retention-days: 5
